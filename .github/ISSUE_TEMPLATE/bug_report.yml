name: Bug report
description: Report a reproducible problem with the card
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration
      render: yaml
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant, HACS, browser, and card versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser console errors
      render: text
