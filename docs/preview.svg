<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Year Progress Card preview</title>
  <desc id="desc">A dark card with a year progress heading, percentage, and progress bar.</desc>
  <rect width="900" height="280" rx="28" fill="#171717"/>
  <text x="55" y="88" fill="#f5f5f5" font-family="Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="4">YEAR PROGRESS</text>
  <text x="845" y="88" fill="#f5f5f5" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="end">66.2%</text>
  <rect x="55" y="130" width="790" height="18" rx="9" fill="#454545"/>
  <rect x="55" y="130" width="523" height="18" rx="9" fill="#f5f5f5"/>
  <text x="55" y="208" fill="#aaa" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">DAY 241 / 365</text>
  <text x="845" y="208" fill="#aaa" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="end">124 DAYS LEFT</text>
